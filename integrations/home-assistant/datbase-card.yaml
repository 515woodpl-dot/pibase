# Dashboard card: Edit dashboard → Add card → Manual → paste this.
type: vertical-stack
cards:
  - type: glance
    title: DATBase
    columns: 4
    entities:
      - entity: binary_sensor.datbase_problem
        name: Problem
      - entity: sensor.datbase_projects_active
        name: Projects
      - entity: sensor.datbase_projects_down
        name: Down
      - entity: sensor.datbase_backups_failed_24h
        name: Backup fails
  - type: horizontal-stack
    cards:
      - type: gauge
        entity: sensor.datbase_disk_used
        name: Disk
        min: 0
        max: 100
        severity:
          green: 0
          yellow: 70
          red: 85
      - type: gauge
        entity: sensor.datbase_memory_used
        name: Memory
        min: 0
        max: 100
        severity:
          green: 0
          yellow: 75
          red: 90
  - type: conditional
    conditions:
      - condition: state
        entity: binary_sensor.datbase_problem
        state: "on"
    card:
      type: markdown
      title: Open problems
      content: >-
        {% for p in state_attr('sensor.datbase_status', 'problems') or [] %}
        - {{ p }}
        {% endfor %}
  - type: entities
    entities:
      - entity: sensor.datbase_status
        name: Status
      - entity: sensor.datbase_last_control_backup
        name: Last database backup
      - entity: sensor.datbase_disk_free
        name: Disk free
      - entity: sensor.datbase_load
        name: Load (1 min)
