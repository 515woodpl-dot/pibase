<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>pibase</title>
<link rel="icon" href="data:,">
<style>
:root{--ink:#17203a;--muted:#66718a;--line:#dde4f0;--tint:#edf3ff;--accent:#2557d6;--accent-dark:#173f9f;--danger:#b4332f;--surface:#fff;--shadow:0 10px 28px rgba(30,52,88,.09);font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--ink)}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:linear-gradient(135deg,#f6f9ff,#eef3fb 52%,#f8faff)}
button,input,textarea{font:inherit;color:inherit;-webkit-tap-highlight-color:transparent}
button{background:#fff;border:1px solid #cbd6e7;border-radius:10px;padding:8px 14px;cursor:pointer}
button:hover{border-color:#8fb0ee}
button:focus-visible,input:focus-visible,textarea:focus-visible,a:focus-visible{outline:3px solid #bcd1ff;outline-offset:1px}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
button.primary:hover{background:var(--accent-dark)}
button.danger{color:var(--danger);border-color:#e4b8b6}
button:disabled{color:#a3acbd;cursor:default;background:#f4f6fa}
input,textarea{width:100%;border:1px solid #cbd6e7;border-radius:10px;padding:9px 11px;background:#fff}
input:focus,textarea:focus{border-color:var(--accent)}
textarea{min-height:150px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:13px}
.hidden{display:none!important}
.muted{color:var(--muted)}
.danger-text{color:var(--danger)}

/* Menu: icons only until opened, then it expands to the right over the page. */
.nav{position:fixed;inset:0 auto 0 0;z-index:30;width:60px;display:flex;flex-direction:column;gap:2px;padding:10px 8px;background:#fff;border-right:1px solid var(--line);overflow-x:hidden;overflow-y:auto}
.nav.open{width:252px;box-shadow:10px 0 32px rgba(30,52,88,.16)}
.nav-item{display:flex;align-items:center;gap:12px;width:100%;min-height:44px;padding:0 12px;border:0;border-radius:11px;background:transparent;text-align:left;white-space:nowrap}
.nav-item:hover{background:var(--tint)}
.nav-item.current{background:var(--tint);color:var(--accent-dark)}
.nav-item svg{flex:0 0 20px;width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.nav-item .lbl{display:none}
.nav.open .lbl{display:inline}
.nav-brand{font-weight:800;letter-spacing:-.01em;color:var(--accent-dark);margin-bottom:6px}
.nav-ctx{display:none;margin:6px 4px 8px;padding:8px 10px;border-radius:10px;background:#eaf2ff;color:#1649a1;font-size:12px;font-weight:700;overflow-wrap:anywhere}
.nav.open .nav-ctx.show{display:block}
.nav-fill{flex:1}
.nav-sep{height:1px;margin:8px 6px;background:var(--line)}
.scrim{position:fixed;inset:0 0 0 60px;z-index:25;background:rgba(23,32,58,.18)}

.app{margin-left:60px;min-height:100vh}
.topbar{display:flex;align-items:center;gap:12px;margin:16px 18px 0;padding:10px 16px;min-height:54px;border:1px solid var(--line);border-radius:14px;background:rgba(255,255,255,.92);box-shadow:var(--shadow)}
.who{min-width:0;flex:1;display:flex;flex-direction:column;line-height:1.25}
.org{font-weight:650;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.email{font-size:12px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#status{font-size:13px;color:var(--muted);overflow-wrap:anywhere;text-align:right}
#opBox{display:flex;gap:8px;flex:0 1 360px}
.back{display:none;margin:10px 10px 0}
.chain{display:flex;gap:18px;align-items:flex-start;padding:18px;overflow-x:auto}
.pane{flex:0 0 400px;min-width:0;padding:24px 22px;background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow)}
.pane.wide{flex-basis:800px}
.pane h1{margin:0 0 6px;font-size:19px;letter-spacing:-.02em}
.intro{margin:0 0 20px;color:var(--muted);overflow-wrap:anywhere}
.group>.intro{margin-bottom:12px;font-size:13px}
.pane p{overflow-wrap:anywhere}

.field{margin:0 0 14px}
.field label{display:block;margin:0 0 5px;font-weight:650}
.field .hint{display:block;margin-top:4px;color:var(--muted);font-size:12px}
.group{margin:0 0 20px;padding:16px;border:1px solid var(--line);border-radius:12px;background:#fbfcff}
.group>h2{margin:0 0 4px;font-size:15px}
.group.danger{border-color:#efc9c7;background:#fff8f8}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0 0}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.key-row{display:flex;gap:8px;align-items:center}
.key-row input{min-width:0;flex:1;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:13px}
.key-row button{white-space:nowrap}
.empty{padding:28px 22px;text-align:center;border:1px dashed #b9cbea;border-radius:14px;background:#f7faff}
.empty h2{margin:0 0 6px;font-size:18px}
.empty p{margin:0 auto 16px;max-width:30em;color:var(--muted)}
.empty .field{max-width:320px;margin:0 auto 12px;text-align:left}

.item{display:block;width:100%;margin:0 0 8px;padding:12px 14px;text-align:left;border:1px solid var(--line);border-radius:12px;background:#fff}
.item:hover{background:var(--tint);border-color:#b9cff7}
.item.active{background:#eaf2ff;border-color:#a9c6f7}
.item b{display:block}
.item span{display:block;margin-top:3px;color:var(--muted);font-size:12px;overflow-wrap:anywhere}

.stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px;margin:0 0 18px}
.stat{padding:12px;border:1px solid var(--line);border-radius:12px;background:#f9fbff}
.stat span{display:block;color:var(--muted);font-size:12px}
.stat b{display:block;margin-top:2px;font-size:18px}
.meter{height:6px;margin-top:8px;border-radius:99px;background:#e1e9f6;overflow:hidden}
.meter i{display:block;height:100%;background:var(--accent)}
.meter.warn i{background:#d99a1e}
.meter.full i{background:#d64545}

.pick{margin:0 0 14px;gap:6px}
.pick button.selected{border-color:var(--accent);color:var(--accent);background:var(--tint)}
.summary{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;margin:0 0 14px}
.summary b{font-size:24px}
.summary span{margin-right:18px;color:var(--muted)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px;margin:0 0 18px}
.card{display:flex;flex-direction:column;padding:14px;border:1px solid var(--line);border-radius:12px;background:#fff}
.card-head{display:flex;gap:14px;align-items:flex-start;margin:0 0 8px}
.card-name{flex:1}
.card-name span,.card-count span{display:block;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.card-name b{font-size:20px}
.card-count{text-align:right}
.card-count.warn span{color:#a8740f}
.card-count.err span{color:#b83232}
.card svg{display:block;width:100%;height:110px;margin-top:auto}
.axis{display:flex;justify-content:space-between;margin-top:6px;color:var(--muted);font-size:11px}
.legend{display:flex;gap:14px;flex-wrap:wrap;margin:0 0 14px;color:var(--muted);font-size:12px}
.legend i{display:inline-block;width:10px;height:10px;margin-right:5px;border-radius:3px;vertical-align:-1px}

.data{overflow:auto;border:1px solid var(--line);border-radius:10px}
table{width:100%;border-collapse:collapse;font-size:12px}
th,td{padding:9px;text-align:left;vertical-align:top;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-weight:600}
pre{margin:0;padding:12px;overflow:auto;white-space:pre-wrap;background:#fafafa;border-radius:10px}

@media(max-width:760px){
  .nav{width:52px;padding:8px 5px}
  .nav-item{padding:0 9px}
  .nav.open{width:min(252px,calc(100vw - 52px))}
  .scrim{inset:0 0 0 52px}
  .app{margin-left:52px}
  .topbar{margin:10px 10px 0;padding:8px 12px;flex-wrap:wrap;gap:6px 10px}
  #status{flex:1 0 100%;text-align:left}
  #status:empty{display:none}
  #opBox{flex:1 0 100%}
  .back{display:inline-block}
  .chain{display:block;padding:10px}
  .chain>.pane:not(:last-child){display:none}
  .pane,.pane.wide{width:auto;padding:16px 14px;border-radius:14px}
  .pane h1{font-size:18px}
  .cards{grid-template-columns:minmax(0,1fr)}
  .stat-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
  input,textarea{font-size:16px}
}
</style>
</head>
<body>
<nav class="nav" id="nav" aria-label="Main menu"></nav>
<div class="scrim hidden" id="scrim"></div>
<main class="app">
  <header class="topbar">
    <div class="who"><span class="org" id="org">pibase</span><span class="email" id="email"></span></div>
    <span id="status" role="status"></span>
    <span id="opBox" class="hidden"><input id="opToken" type="password" placeholder="Operator token" autocomplete="off" aria-label="Operator token"><button class="primary" id="opLoad">Load</button></span>
  </header>
  <button class="back hidden" id="back">‹ Back</button>
  <div class="chain" id="chain"></div>
</main>
<script>
const q=id=>document.getElementById(id), chain=q('chain');
let projects=[], selected=null, account=null, operator=false, uid=0;

/* ---------- small helpers ---------- */
function el(tag,text,cls){const e=document.createElement(tag);if(text!==undefined&&text!==null)e.textContent=text;if(cls)e.className=cls;return e}
function svgEl(tag,attrs){const e=document.createElementNS('http://www.w3.org/2000/svg',tag);for(const k in attrs)e.setAttribute(k,attrs[k]);return e}
function button(text,fn,cls){const b=el('button',text,cls);b.onclick=fn;return b}
function pane(title,intro){const p=el('section',null,'pane');p.append(el('h1',title));if(intro)p.append(el('p',intro,'intro'));return p}
function clearFrom(n){while(chain.children.length>n)chain.lastChild.remove()}
function add(p){chain.append(p);alignChain()}
function alignChain(){chain.style.paddingRight='0px';const max=chain.scrollWidth-chain.clientWidth;let x=max;for(const c of chain.children){const left=c.offsetLeft-chain.offsetLeft;if(left>=max){x=left;break}}if(x>max)chain.style.paddingRight=(x-max)+'px';x=Math.max(0,x-18);chain.scrollLeft=x}
function field(label,control,hint,...extras){const f=el('div',null,'field');const id='f'+(++uid);control.id=id;const l=el('label',label);l.htmlFor=id;f.append(l);if(extras.length){const row=el('div',null,'key-row');row.append(control,...extras);f.append(row)}else f.append(control);if(hint)f.append(el('span',hint,'hint'));return f}
// Title and intro of a pane, copied so a pane can be rebuilt after it has loaded.
function head(p){return [...p.querySelectorAll(':scope>h1,:scope>.intro')].map(n=>n.cloneNode(true))}
function group(title,desc,...kids){const g=el('div',null,'group');if(title)g.append(el('h2',title));if(desc)g.append(el('p',desc,'intro'));g.append(...kids);return g}
function input(type,placeholder,value){const i=el('input');i.type=type;if(placeholder)i.placeholder=placeholder;if(value!==undefined&&value!==null)i.value=value;return i}
function note(text){return el('p',text,'muted')}
function say(m){q('status').textContent=m||''}
function cell(v){if(v===null)return 'NULL';return typeof v==='object'?JSON.stringify(v):String(v)}
function dataTable(columns,rows){const d=el('div',null,'data');const table=el('table'),head=el('tr');for(const c of columns)head.append(el('th',c));table.append(head);for(const row of rows){const tr=el('tr');for(const c of columns){const td=el('td',cell(row[c]));if(row[c]===null)td.className='muted';tr.append(td)}table.append(tr)}d.append(table);return d}
function bytes(n){n=Number(n)||0;const u=['B','KB','MB','GB','TB'];let i=0;while(n>=1024&&i<u.length-1){n/=1024;i++}return (i?n.toFixed(n<10?1:0):n)+' '+u[i]}
function plural(n,word){return n+' '+word+(n===1?'':'s')}
function apiHeaders(){return account?{'Content-Type':'application/json'}:{Authorization:'Bearer '+q('opToken').value,'Content-Type':'application/json'}}
async function api(path,opt={}){opt.headers=apiHeaders();const r=await fetch(path,opt),t=await r.text();if(r.status===401&&account){location.replace('/');throw Error('Signed out')}if(!r.ok)throw Error(t.trim()||r.status);return t?JSON.parse(t):null}
function body(v,method='POST'){return{method,body:JSON.stringify(v)}}
function projectPath(){return '/_pibase/projects/'+encodeURIComponent(selected.id)}
function apiBase(x){return (x&&x.api_url)||(location.protocol+'//'+location.hostname+':18080')}
async function copyText(value,status){try{if(navigator.clipboard&&window.isSecureContext){await navigator.clipboard.writeText(value)}else{const t=document.createElement('textarea');t.value=value;document.body.append(t);t.select();document.execCommand('copy');t.remove()}status.textContent='Copied'}catch(e){status.textContent='Copy failed: '+e.message}}
function copyField(label,value,hint){const i=input('text','',value);i.readOnly=true;const status=el('span',null,'muted');return field(label,i,hint,button('Copy',()=>copyText(value,status)),status)}
function secretField(label,value,hint){const i=input('password','',value);i.readOnly=true;const status=el('span',null,'muted');const reveal=button('Reveal',()=>{i.type=i.type==='password'?'text':'password';reveal.textContent=i.type==='password'?'Reveal':'Hide'});return field(label,i,hint,reveal,button('Copy',()=>copyText(value,status)),status)}

/* ---------- menu ---------- */
const ICONS={menu:'M4 6h16M4 12h16M4 18h16',grid:'M4 4h7v7H4zM13 4h7v7h-7zM4 13h7v7H4zM13 13h7v7h-7z',chart:'M4 20V9M10 20V4M16 20v-8M3 20h18',table:'M3 5h18v14H3zM3 10h18M9 5v14',users:'M16 20v-1a4 4 0 0 0-4-4H7a4 4 0 0 0-4 4v1M9.5 11a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7M21 20v-1a4 4 0 0 0-3-3.9M15 4.2a3.5 3.5 0 0 1 0 6.6',code:'M8 7l-5 5 5 5M16 7l5 5-5 5M14 4l-4 16',layers:'M12 3l9 5-9 5-9-5zM3 13l9 5 9-5',archive:'M3 4h18v5H3zM5 9v11h14V9M10 13h4',key:'M7 14a4 4 0 1 1 3.9-4.9H21v3h-2v2h-3v-2h-5.1A4 4 0 0 1 7 14z',puzzle:'M12 3v4M12 17v4M3 12h4M17 12h4M6 6l2.5 2.5M15.5 15.5L18 18M6 18l2.5-2.5M15.5 8.5L18 6',gear:'M12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6M19 12a7 7 0 0 0-.1-1.2l2-1.5-2-3.4-2.3.9a7 7 0 0 0-2-1.2L14.2 3h-4l-.4 2.6a7 7 0 0 0-2 1.2l-2.3-.9-2 3.4 2 1.5A7 7 0 0 0 5 12c0 .4 0 .8.1 1.2l-2 1.5 2 3.4 2.3-.9c.6.5 1.3.9 2 1.2l.4 2.6h4l.4-2.6c.7-.3 1.4-.7 2-1.2l2.3.9 2-3.4-2-1.5c.1-.4.1-.8.1-1.2z',user:'M12 12a4 4 0 1 0 0-8 4 4 0 0 0 0 8M4 21a8 8 0 0 1 16 0',logout:'M9 4H5v16h4M16 8l4 4-4 4M20 12H9'};
function icon(name){const s=svgEl('svg',{viewBox:'0 0 24 24','aria-hidden':'true'});s.append(svgEl('path',{d:ICONS[name]||ICONS.grid}));return s}
// key, label, icon, needs a project, operator only
const MENU=[['projects','Projects','grid',false],['overview','Overview','chart',true],['tables','Tables','table',true],['users','Users','users',true],['sql','SQL','code',true],['migrations','Migrations','layers',true],['backups','Backups','archive',true],['api','API keys','key',true],['extensions','Extensions','puzzle',true,true],['settings','Settings','gear',true]];
const ACTIONS={projects:()=>load(),overview:()=>openOverview(),tables:()=>openTables(),users:()=>openUsers(),sql:()=>openSQL(),migrations:()=>openMigrations(),backups:()=>openBackups(),api:()=>openKeys(),extensions:()=>openExtensions(),settings:()=>openSettings(),account:()=>openAccount(),logout:()=>logout()};
function navButton(key,label,ic,cls){const b=el('button',null,'nav-item'+(cls?' '+cls:''));b.dataset.menu=key;b.title=label;b.setAttribute('aria-label',label);b.append(icon(ic),el('span',label,'lbl'));return b}
function buildNav(){
  const nav=q('nav');
  const toggle=navButton('menu','Menu','menu','nav-brand');toggle.id='navToggle';toggle.setAttribute('aria-expanded','false');toggle.querySelector('.lbl').textContent='pibase';toggle.onclick=()=>navOpen(!nav.classList.contains('open'));
  const ctx=el('div',null,'nav-ctx');ctx.id='navCtx';
  nav.append(toggle,ctx);
  for(const [key,label,ic,needs,op] of MENU){const b=navButton(key,label,ic,(needs?'needs-project ':'')+(op?'operator-only':''));b.onclick=()=>pick(key);nav.append(b)}
  nav.append(el('div',null,'nav-fill'),el('div',null,'nav-sep'));
  const acct=navButton('account','Account','user','account-only');acct.onclick=()=>pick('account');
  const out=navButton('logout','Log out','logout','account-only');out.onclick=()=>pick('logout');
  nav.append(acct,out);
  q('scrim').onclick=()=>navOpen(false);
  document.addEventListener('keydown',e=>{if(e.key==='Escape')navOpen(false)});
  refreshNav()
}
function navOpen(open){q('nav').classList.toggle('open',open);q('scrim').classList.toggle('hidden',!open);q('navToggle').setAttribute('aria-expanded',String(open))}
function pick(key){navOpen(false);setCurrent(key);ACTIONS[key]()}
function setCurrent(key){document.querySelectorAll('.nav-item[data-menu]').forEach(b=>b.classList.toggle('current',b.dataset.menu===key))}
function refreshNav(){
  document.querySelectorAll('.needs-project').forEach(b=>b.classList.toggle('hidden',!selected));
  document.querySelectorAll('.operator-only').forEach(b=>b.classList.toggle('hidden',!!account));
  document.querySelectorAll('.account-only').forEach(b=>b.classList.toggle('hidden',!account));
  const ctx=q('navCtx');ctx.textContent=selected?'Working in: '+selected.name:'';ctx.classList.toggle('show',!!selected)
}

/* ---------- start-up, account, sign-out ---------- */
function renderWho(){
  q('org').textContent=account?(account.organization||'Your account'):'Operator';
  q('email').textContent=account?account.email:'Signed in with the operator token';
  q('opBox').classList.toggle('hidden',!!account)
}
async function init(){
  buildNav();
  try{const r=await fetch('/_pibase/auth/me');if(r.ok){account=await r.json();renderWho();refreshNav();load();return}}catch(_){}
  if(location.hash==='#operator'){operator=true;renderWho();refreshNav();q('opLoad').onclick=load;q('opToken').addEventListener('keydown',e=>{if(e.key==='Enter')load()});add(operatorPane());return}
  location.replace('/')
}
// Operator only: give a dashboard account a new password, for people who
// can't receive a reset email.
function accountsPane(){
  const p=pane('Dashboard accounts','Reset the password of anyone who signs in to this dashboard. They are signed out everywhere and log in with the new password.');
  const em=input('email','name@example.com'),pw=input('password',''),pw2=input('password',''),st=note('');
  pw.autocomplete='new-password';pw2.autocomplete='new-password';
  p.append(group('Reset a password','Use this when someone forgot their password and this server cannot email them a link.',field('Account email',em),field('New password',pw,'At least 8 characters. Tell it to them privately.'),field('Enter it again',pw2),button('Set new password',async()=>{
    if(pw.value.length<8){st.textContent='The password must be at least 8 characters.';return}
    if(pw.value!==pw2.value){st.textContent='The two passwords do not match.';return}
    try{await api('/_pibase/operator/account-password',body({email:em.value.trim(),password:pw.value}));st.textContent='Password changed for '+em.value.trim()+'. They were signed out everywhere.';pw.value='';pw2.value=''}catch(e){st.textContent=e.message}},'primary'),st));
  return p
}
function operatorPane(){return pane('Operator access','Enter the operator token above and press Load to see every project on this server.')}
async function logout(){try{await fetch('/_pibase/auth/logout',{method:'POST'})}catch(_){}location.replace('/')}

/* ---------- projects ---------- */
function createProjectForm(first){
  const name=input('text','for example: inventory');
  const status=el('p',null,'muted');
  const go=async()=>{
    try{const x=await api('/_pibase/projects',body({name:name.value}));projects=(await api('/_pibase/projects'))||[];selected=projects.find(p=>p.id===x.id)||x;refreshNav();clearFrom(0);add(projectsPane());say(plural(projects.length,'project'));setCurrent('overview');openOverview();openKeys('Your project is ready. Copy these keys into your app, or come back to this page any time under API keys.')}
    catch(e){status.textContent=e.message}
  };
  const f=field('Project name',name,'Letters, numbers and spaces. You can rename it later.');
  const create=button('Create project',go,'primary');
  const box=first?el('div',null,'empty'):group('New project','A new, empty Postgres database with its own API address and keys.');
  if(first)box.append(el('h2','Create your first project'),el('p','A project is a private Postgres database with its own API address and keys. Create one to start building.'));
  box.append(f,create,status);
  return box
}
function orgPrompt(){
  const name=input('text','Your company, team or name');const status=note('');
  return group('Add your organization name','Your account does not have an organization name yet. It is shown at the top of every page.',field('Organization name',name),button('Save',async()=>{try{account=await api('/_pibase/auth/organization',body({organization:name.value},'PATCH'));renderWho();load()}catch(e){status.textContent=e.message}},'primary'),status)
}
function renderProjectList(list){
  list.replaceChildren();
  for(const x of projects){const b=button(null,()=>openProject(x),'item'+(selected&&selected.id===x.id?' active':''));b.append(el('b',x.name),el('span',[x.id,x.database_bytes!==undefined?bytes(x.database_bytes)+' database':'',x.requests_30d!==undefined?plural(x.requests_30d,'request')+' in 30 days':''].filter(Boolean).join(' · ')));list.append(b)}
}
function projectsPane(){
  const p=pane('Projects','Each project is its own Postgres database with its own API address and keys. Pick a project to see how it is being used and to manage it.');
  if(account&&!account.organization)p.append(orgPrompt());
  if(!projects.length){p.append(createProjectForm(true),importButton());return p}
  const list=el('div');list.id='projectList';renderProjectList(list);
  p.append(list);

function shortTime(t,step){const d=new Date(t),hm=d.toLocaleTimeString(undefined,{hour:'numeric',minute:'2-digit'});return step>=86400?d.toLocaleDateString(undefined,{month:'short',day:'numeric'}):step>=3600?d.toLocaleDateString(undefined,{month:'short',day:'numeric'})+', '+hm:hm}
function bars(series,step,plain){const w=300,h=110,n=series.length||1,bw=w/n,max=Math.max(1,...series.map(x=>x.requests));const svg=svgEl('svg',{viewBox:'0 0 '+w+' '+h,role:'img'});svg.append(svgEl('path',{d:'M0 '+(h-0.5)+'H'+w,stroke:'#dce3ef',fill:'none'}));series.forEach((x,i)=>{if(!x.requests)return;const left=i*bw+bw*0.15,width=Math.max(1,bw*0.7);let y=h;for(const [v,color] of [[x.requests-x.warnings-x.errors,'#2fb47c'],[x.warnings,'#d99a1e'],[x.errors,'#d64545']]){if(v<=0)continue;const bh=Math.max(1.5,v/max*(h-8));y-=bh;const r=svgEl('rect',{x:left,y:y,width:width,height:bh,fill:color});const tip=svgEl('title',{});tip.textContent=shortTime(x.t,step)+': '+(plain?plural(x.requests,'request'):x.requests+' requests, '+x.warnings+' warnings, '+x.errors+' errors');r.append(tip);svg.append(r)}});return svg}

  if(!plain){const warn=el('div',null,'card-count warn');warn.append(el('span','Warnings'),el('b',String(s.warnings)));const err=el('div',null,'card-count err');err.append(el('span','Errors'),el('b',String(s.errors)));head.append(warn,err)}
  const axis=el('div',null,'axis');axis.append(el('span',shortTime(from,step)),el('span',shortTime(to,step)));

}
function dailyPoints(rows){const by={};for(const r of rows||[])by[String(r.day).slice(0,10)]=Number(r.requests)||0;const out=[],now=new Date();for(let i=29;i>=0;i--){const d=new Date(Date.UTC(now.getUTCFullYear(),now.getUTCMonth(),now.getUTCDate()-i));out.push({t:d.toISOString(),requests:by[d.toISOString().slice(0,10)]||0,warnings:0,errors:0})}return out}
function statTile(label,value,sub,meter){const s=el('div',null,'stat');s.append(el('span',label),el('b',value));if(sub)s.append(el('span',sub));if(meter!==undefined){const m=el('div',null,'meter'+(meter>=1?' full':meter>=0.8?' warn':''));const fill=el('i');fill.style.width=Math.min(100,meter*100).toFixed(1)+'%';m.append(fill);s.append(m)}return s}
async function openOverview(win){
  win=typeof win==='string'?win:'60m';
  const x=selected;if(!x)return;clearFrom(1);

    let a,days,fresh;
    try{[a,days,fresh]=await Promise.all([api('/_pibase/projects/'+encodeURIComponent(x.id)+'/activity?window='+win),api('/_pibase/projects/'+encodeURIComponent(x.id)+'/usage'),refreshProject(x)])}

    stats.append(statTile('File storage',fresh.storage_error?'Unavailable':bytes(fresh.storage_bytes),fresh.storage_error?'Cannot read the files folder':'Files in storage'));

    const sum=el('div',null,'summary');
    sum.append(el('b',String(a.requests)),el('span','Total requests'),el('b',a.success_rate===null?'—':(a.success_rate*100).toFixed(1)+'%'),el('span','Success rate'));
    const legend=el('div',null,'legend');
    for(const [c,t] of [['#2fb47c','Succeeded'],['#d99a1e','Warnings: the request was refused or invalid (4xx)'],['#d64545','Errors: the server failed (5xx)']]){const s=el('span');const dot=el('i');dot.style.background=c;s.append(dot,document.createTextNode(t));legend.append(s)}

    for(const s of a.services)cards.append(chartCard(SERVICE_LABEL[s.service]||s.service,s,a.from,a.to,a.bucket_seconds,SERVICE_NOTE[s.service]));

    dailyCard.style.margin='0 0 18px';
    const children=[...h.map(n=>n.cloneNode(true)),el('p','Project ID: '+x.id,'muted'),stats];
    if(fresh.storage_error)children.push(el('p','Storage: '+fresh.storage_error,'danger-text'));
    children.push(el('h2','Requests'),pickRow,sum);

}

function openAccount(){
  clearFrom(0);const p=pane('Account','Your dashboard sign-in and organization. This is separate from the users of your projects.');
  const org=input('text','',account.organization||''),os=note('');
  p.append(group('Organization','The name shown at the top of every page.',field('Organization name',org),button('Save',async()=>{try{account=await api('/_pibase/auth/organization',body({organization:org.value},'PATCH'));renderWho();os.textContent='Saved'}catch(e){os.textContent=e.message}},'primary'),os));
  const cur=input('password',''),nw=input('password',''),nw2=input('password',''),ps=note('');
  p.append(group('Password','Choose a new password. You will be signed out everywhere else.',field('Current password',cur),field('New password',nw,'At least 8 characters.'),field('New password again',nw2),button('Change password',async()=>{if(nw.value!==nw2.value){ps.textContent='The two new passwords do not match.';return}try{await api('/_pibase/auth/password',body({current_password:cur.value,new_password:nw.value}));cur.value=nw.value=nw2.value='';ps.textContent='Password updated.'}catch(e){ps.textContent=e.message}},'primary'),ps));
  const sure=input('text',''),ds=note('');
  const dg=group('Delete account','Permanently deletes your account and every project in it, with all their data. This cannot be undone.',field('Type '+account.email+' to confirm',sure),button('Delete account',async()=>{try{await api('/_pibase/auth/account',body({confirm:sure.value},'DELETE'));location.replace('/')}catch(e){ds.textContent=e.message}},'danger'),ds);
  dg.classList.add('danger');p.append(dg);add(p)
}

/* ---------- behaviour ---------- */
document.addEventListener('keydown',e=>{if(e.key!=='Enter'||e.target.tagName!=='INPUT'||e.target.readOnly)return;const g=e.target.closest('.group,.empty');const act=g&&g.querySelector('button.primary');if(act){e.preventDefault();act.click()}});
const backBtn=q('back');backBtn.onclick=()=>{if(chain.children.length>1){chain.lastChild.remove();alignChain()}};
new MutationObserver(()=>backBtn.classList.toggle('hidden',chain.children.length<2)).observe(chain,{childList:true});
init();
</script>
