<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>pibase</title>
<link rel="icon" href="/pwa/favicon-32.png" type="image/png">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="theme-color" content="#2557d6">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="pibase">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<style>
:root{--ink:#17203a;--muted:#66718a;--line:#dde4f0;--tint:#edf3ff;--accent:#2557d6;--accent-dark:#173f9f;--danger:#b4332f;--surface:#fff;--shadow:0 10px 28px rgba(30,52,88,.09);font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--ink)}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:linear-gradient(135deg,#f6f9ff,#eef3fb 52%,#f8faff)}
button,input,textarea{font:inherit;color:inherit;-webkit-tap-highlight-color:transparent}
button{background:#fff;border:1px solid #cbd6e7;border-radius:10px;padding:8px 14px;cursor:pointer}
button:hover{border-color:#8fb0ee}
button:focus-visible,input:focus-visible,textarea:focus-visible,a:focus-visible{outline:3px solid #bcd1ff;outline-offset:1px}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
button.primary:hover{background:var(--accent-dark)}
button.danger{color:var(--danger);border-color:#e4b8b6}
button:disabled{color:#a3acbd;cursor:default;background:#f4f6fa}
input,textarea{width:100%;border:1px solid #cbd6e7;border-radius:10px;padding:9px 11px;background:#fff}
input:focus,textarea:focus{border-color:var(--accent)}
textarea{min-height:150px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:13px}
select{font:inherit;color:inherit;width:100%;border:1px solid #cbd6e7;border-radius:10px;padding:9px 11px;background:#fff;margin-bottom:8px}
input[type=checkbox]{width:auto;transform:scale(1.3);margin:6px 4px}
textarea[rows="2"]{min-height:64px}
.hidden{display:none!important}
.muted{color:var(--muted)}
p.warn{color:#a8740f;font-weight:600}
p.warn:empty{display:none}
.danger-text{color:var(--danger)}

/* Menu: icons only until opened, then it expands to the right over the page. */
.nav{position:fixed;inset:0 auto 0 0;z-index:30;width:60px;display:flex;flex-direction:column;gap:2px;padding:10px 8px;background:#fff;border-right:1px solid var(--line);overflow-x:hidden;overflow-y:auto}
.nav.open{width:252px;box-shadow:10px 0 32px rgba(30,52,88,.16)}
.nav-item{display:flex;align-items:center;gap:12px;width:100%;min-height:44px;padding:0 12px;border:0;border-radius:11px;background:transparent;text-align:left;white-space:nowrap}
.nav-item:hover{background:var(--tint)}
.nav-item.current{background:var(--tint);color:var(--accent-dark)}
.nav-item svg{flex:0 0 20px;width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.nav-item .lbl{display:none}
.nav.open .lbl{display:inline}
.nav-brand{font-weight:800;letter-spacing:-.01em;color:var(--accent-dark);margin-bottom:6px}
.nav-ctx{display:none;margin:6px 4px 8px;padding:8px 10px;border-radius:10px;background:#eaf2ff;color:#1649a1;font-size:12px;font-weight:700;overflow-wrap:anywhere}
.nav.open .nav-ctx.show{display:block}
.nav-fill{flex:1}
.nav-sep{height:1px;margin:8px 6px;background:var(--line)}
.scrim{position:fixed;inset:0 0 0 60px;z-index:25;background:rgba(23,32,58,.18)}

.app{margin-left:60px;min-height:100vh;min-width:0;overflow-x:hidden}
.topbar{display:flex;align-items:center;gap:12px;margin:16px 18px 0;padding:10px 16px;min-height:54px;border:1px solid var(--line);border-radius:14px;background:rgba(255,255,255,.92);box-shadow:var(--shadow)}
.who{min-width:0;flex:1;display:flex;flex-direction:column;line-height:1.25}
.org{font-weight:650;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.email{font-size:12px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#status{font-size:13px;color:var(--muted);overflow-wrap:anywhere;text-align:right}
#opBox{display:flex;gap:8px;flex:0 1 360px}
.back{display:inline-block;margin:10px 18px 0}
.chain{display:block;padding:18px}
.chain>.pane:not(:last-child){display:none}
.pane{width:100%;max-width:1100px;margin:0 auto;min-width:0;padding:24px 22px;background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow)}
.pane.wide{max-width:1400px}
.pane h1{margin:0;font-size:19px;letter-spacing:-.02em;flex:1;min-width:0}
.pane-top{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:0 0 6px}
.pane-actions{display:flex;gap:8px;flex-wrap:wrap}
.pane h2.section{margin:22px 0 10px;font-size:15px}
.intro{margin:0 0 20px;color:var(--muted);overflow-wrap:anywhere}
.group>.intro{margin-bottom:12px;font-size:13px}
.pane p{overflow-wrap:anywhere}

.field{margin:0 0 14px}
.field label{display:block;margin:0 0 5px;font-weight:650}
.field .hint{display:block;margin-top:4px;color:var(--muted);font-size:12px}
.group{margin:0 0 20px;padding:16px;border:1px solid var(--line);border-radius:12px;background:#fbfcff}
.group>h2{margin:0 0 4px;font-size:15px}
.group.danger{border-color:#efc9c7;background:#fff8f8}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0 0}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.key-row{display:flex;gap:8px;align-items:center}
.key-row input{min-width:0;flex:1;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:13px}
.key-row button{white-space:nowrap}
.empty{padding:28px 22px;text-align:center;border:1px dashed #b9cbea;border-radius:14px;background:#f7faff}
.empty h2{margin:0 0 6px;font-size:18px}
.empty p{margin:0 auto 16px;max-width:30em;color:var(--muted)}
.empty .field{max-width:320px;margin:0 auto 12px;text-align:left}

.item{display:block;width:100%;margin:0 0 8px;padding:12px 14px;text-align:left;border:1px solid var(--line);border-radius:12px;background:#fff}
.item:hover{background:var(--tint);border-color:#b9cff7}
.item.active{background:#eaf2ff;border-color:#a9c6f7}
.item b{display:block}
.item span{display:block;margin-top:3px;color:var(--muted);font-size:12px;overflow-wrap:anywhere}

.stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px;margin:0 0 18px}
.stat{padding:12px;border:1px solid var(--line);border-radius:12px;background:#f9fbff}
.stat span{display:block;color:var(--muted);font-size:12px}
.stat b{display:block;margin-top:2px;font-size:18px}
.meter{height:6px;margin-top:8px;border-radius:99px;background:#e1e9f6;overflow:hidden}
.meter i{display:block;height:100%;background:var(--accent)}
.meter.warn i{background:#d99a1e}
.meter.full i{background:#d64545}

.pick{margin:0 0 14px;gap:6px}
.pick button.selected{border-color:var(--accent);color:var(--accent);background:var(--tint)}
.summary{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;margin:0 0 14px}
.summary b{font-size:24px}
.summary span{margin-right:18px;color:var(--muted)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px;margin:0 0 18px}
.card{display:flex;flex-direction:column;padding:14px;border:1px solid var(--line);border-radius:12px;background:#fff}
.card-head{display:flex;gap:14px;align-items:flex-start;margin:0 0 8px}
.card-name{flex:1}
.card-name span,.card-count span{display:block;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.card-name b{font-size:20px}
.card-count{text-align:right}
.card-count.warn span{color:#a8740f}
.card-count.err span{color:#b83232}
.card svg{display:block;width:100%;height:110px;margin-top:auto}
.axis{display:flex;justify-content:space-between;margin-top:6px;color:var(--muted);font-size:11px}
.legend{display:flex;gap:14px;flex-wrap:wrap;margin:0 0 14px;color:var(--muted);font-size:12px}
.legend i{display:inline-block;width:10px;height:10px;margin-right:5px;border-radius:3px;vertical-align:-1px}

.data{overflow:auto;border:1px solid var(--line);border-radius:10px}
table{width:100%;border-collapse:collapse;font-size:12px}
th,td{padding:9px;text-align:left;vertical-align:top;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-weight:600}
pre{margin:0;padding:12px;overflow:auto;white-space:pre-wrap;background:#fafafa;border-radius:10px}

/* Cards */
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(260px,100%),1fr));gap:14px;margin:0 0 20px}
.tiles.wide{grid-template-columns:repeat(auto-fill,minmax(min(380px,100%),1fr))}
.tiles.fit{grid-template-columns:repeat(auto-fit,minmax(min(300px,100%),1fr))}
textarea.code{min-height:0;white-space:pre;overflow-wrap:normal;overflow-x:auto;resize:vertical}
.tile{display:flex;flex-direction:column;gap:10px;min-width:0;padding:16px;border:1px solid var(--line);border-radius:14px;background:#fff;text-align:left;color:inherit;font:inherit}
button.tile{width:100%;cursor:pointer}
button.tile:hover{border-color:#a9c4f5;background:#fff;box-shadow:0 8px 22px rgba(30,52,88,.10)}
.tile.active{border-color:#a9c6f7;box-shadow:0 0 0 3px #e3edff}
.tile-top{display:flex;gap:12px;align-items:center;min-width:0}
.tile-title{min-width:0;flex:1}
.tile-title b,.tile h3{display:block;margin:0;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tile-title span{display:block;margin-top:1px;font-size:12px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tile-value{font-size:15px;font-weight:600;overflow-wrap:anywhere}
.tile-value.off{color:var(--muted);font-weight:500}
.tile-body{margin:0;color:var(--muted);font-size:13px}
.tile .field{margin:0}
.tile textarea{min-height:0}
.tile-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:auto;padding-top:4px}
.tile.add{align-items:center;justify-content:center;min-height:132px;border:1.5px dashed #b9cbea;background:#f7faff;color:var(--accent-dark);font-weight:650}
.tile.add:hover{background:#eef4ff}
.tile.danger{border-color:#efc9c7;background:#fffafa}
.tile.danger h3,.tile.danger .tile-title b{color:var(--danger)}
.avatar{flex:0 0 40px;width:40px;height:40px;border-radius:12px;display:grid;place-items:center;font-weight:750;font-size:16px;color:#fff}
.avatar.round{border-radius:50%}
.avatar.icon{background:var(--tint);color:var(--accent-dark)}
.avatar.icon svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tile.danger .avatar.icon{background:#fde6e5;color:var(--danger)}
.badges{display:flex;gap:6px;flex-wrap:wrap}
.badge{display:inline-flex;align-items:center;max-width:100%;padding:2px 9px;border-radius:99px;font-size:11.5px;font-weight:650;background:#eef2f8;color:#4a5670;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.badge.ok{background:#e3f6ec;color:#1d7a4d}
.badge.warn{background:#fdf1dc;color:#8a5d0b}
.badge.bad{background:#fde6e5;color:#a32c28}
.badge.info{background:#e7efff;color:#1f4fb8}
button.small{padding:5px 11px;font-size:13px;border-radius:9px}
button.danger.solid{background:var(--danger);border-color:var(--danger);color:#fff}
button.danger.solid:disabled{background:#e9b9b7;border-color:#e9b9b7;color:#fff}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 12px}
.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:0 0 14px}
.toolbar input{max-width:340px}
.banner{padding:12px 14px;margin:0 0 16px;border-radius:12px;border:1px solid #f0d9a8;background:#fdf6e6;color:#7a5208;font-weight:600}
.banner.info{border-color:#c7d8fb;background:#eef4ff;color:#1f4fb8}
.switch-row{display:flex;gap:12px;align-items:center;font-weight:650}
input[type=checkbox].switch{appearance:none;-webkit-appearance:none;position:relative;flex:0 0 44px;width:44px;height:26px;margin:0;padding:0;border:0;border-radius:99px;background:#cbd6e7;cursor:pointer;transform:none}
input[type=checkbox].switch::after{content:'';position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25)}
input[type=checkbox].switch:checked{background:var(--accent)}
input[type=checkbox].switch:checked::after{left:21px}

/* Pop-up windows */
.modal-back{position:fixed;inset:0;z-index:50;display:flex;align-items:flex-start;justify-content:center;padding:8vh 16px 16px;background:rgba(23,32,58,.42);overflow-y:auto}
.modal{width:100%;max-width:520px;border:1px solid var(--line);border-radius:16px;background:#fff;box-shadow:0 24px 60px rgba(23,32,58,.3)}
.modal.wide{max-width:780px}
.modal-head{display:flex;align-items:flex-start;gap:12px;padding:20px 22px 0}
.modal-head h2{flex:1;min-width:0;margin:0;font-size:18px;overflow-wrap:anywhere}
.modal.danger .modal-head h2{color:var(--danger)}
button.modal-x{border:0;background:transparent;padding:0 6px;font-size:24px;line-height:1;color:var(--muted)}
.modal-body{padding:8px 22px 0}
.modal-body>.intro{margin:0 0 16px;font-size:13.5px}
.modal-foot{display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap;padding:16px 22px 20px}
.modal-status{flex:1 1 100%;margin:0;color:var(--danger)}
.modal-status:empty{display:none}
.toast{position:fixed;left:50%;bottom:22px;z-index:60;max-width:calc(100vw - 32px);padding:11px 18px;border-radius:12px;background:#17203a;color:#fff;box-shadow:0 12px 30px rgba(23,32,58,.3);transform:translateX(-50%)}

@media(max-width:760px){
  .modal-back{padding:12px 10px}
  .modal-head{padding:16px 16px 0}.modal-body{padding:8px 16px 0}.modal-foot{padding:14px 16px 16px}
  .toolbar input{max-width:none}
  .nav{width:52px;padding:8px 5px}
  .nav-item{padding:0 9px}
  .nav.open{width:min(252px,calc(100vw - 52px))}
  .scrim{inset:0 0 0 52px}
  .app{margin-left:52px}
  .topbar{margin:10px 10px 0;padding:8px 12px;flex-wrap:wrap;gap:6px 10px}
  #status{flex:1 0 100%;text-align:left}
  #status:empty{display:none}
  #opBox{flex:1 0 100%}
  .chain{padding:10px}
  .back{margin:10px 10px 0}
  .pane,.pane.wide{width:auto;padding:16px 14px;border-radius:14px}
  .pane h1{font-size:18px}
  .cards{grid-template-columns:minmax(0,1fr)}
  .stat-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
  input,textarea{font-size:16px}
}
</style>
</head>
<body>
<nav class="nav" id="nav" aria-label="Main menu"></nav>
<div class="scrim hidden" id="scrim"></div>
<main class="app">
  <header class="topbar">
    <div class="who"><span class="org" id="org">pibase</span><span class="email" id="email"></span></div>
    <span id="status" role="status"></span>
    <span id="opBox" class="hidden"><input id="opToken" type="password" placeholder="Operator token" autocomplete="off" aria-label="Operator token"><button class="primary" id="opLoad">Load</button></span>
  </header>
  <button class="back hidden" id="back">‹ Back</button>
  <div class="chain" id="chain"></div>
</main>
<script>
const q=id=>document.getElementById(id), chain=q('chain');
let projects=[], selected=null, account=null, operator=false, uid=0;

/* ---------- small helpers ---------- */
function el(tag,text,cls){const e=document.createElement(tag);if(text!==undefined&&text!==null)e.textContent=text;if(cls)e.className=cls;return e}
function svgEl(tag,attrs){const e=document.createElementNS('http://www.w3.org/2000/svg',tag);for(const k in attrs)e.setAttribute(k,attrs[k]);return e}
function button(text,fn,cls){const b=el('button',text,cls);b.onclick=fn;return b}
function pane(title,intro){const p=el('section',null,'pane');const top=el('div',null,'pane-top');top.append(el('h1',title));p.append(top);if(intro)p.append(el('p',intro,'intro'));return p}
// Buttons beside a pane's title, such as "+ Add user".
function topAction(p,...btns){let a=p.querySelector(':scope>.pane-top>.pane-actions');if(!a){a=el('div',null,'pane-actions');p.querySelector(':scope>.pane-top').append(a)}a.append(...btns)}
function clearFrom(n){while(chain.children.length>n)chain.lastChild.remove()}
function add(p){chain.append(p);alignChain()}
function alignChain(){chain.style.paddingRight='';const l=chain.lastElementChild;if(l&&chain.children.length>1&&l.scrollIntoView)l.scrollIntoView({block:'nearest',behavior:'smooth'})}
function field(label,control,hint,...extras){const f=el('div',null,'field');const id='f'+(++uid);control.id=id;const l=el('label',label);l.htmlFor=id;f.append(l);if(extras.length){const row=el('div',null,'key-row');row.append(control,...extras);f.append(row)}else f.append(control);if(hint)f.append(el('span',hint,'hint'));return f}
// Title and intro of a pane, copied so a pane can be rebuilt after it has loaded.
function head(p){return [...p.querySelectorAll(':scope>.pane-top,:scope>.intro')].map(n=>n.cloneNode(true))}

/* ---------- cards, pop-up windows, toasts ---------- */
function sbtn(text,fn,cls){return button(text,fn,'small'+(cls?' '+cls:''))}
function badge(text,kind){return el('span',text,'badge'+(kind?' '+kind:''))}
function avatar(text,round){text=String(text||'?');const a=el('span',text.trim().charAt(0).toUpperCase()||'?','avatar'+(round?' round':''));let h=0;for(const c of text)h=(h*31+c.charCodeAt(0))%360;a.style.background='hsl('+h+',52%,46%)';a.setAttribute('aria-hidden','true');return a}
function iconBadge(name){const a=el('span',null,'avatar icon');a.append(icon(name));return a}
// A card. With open it is one big button, so it takes no action buttons.
function tile({lead,title,sub,value,off,body,badges,actions,open,cls,kids}){
  const t=el(open?'button':'div',null,'tile'+(cls?' '+cls:''));if(open)t.onclick=open;
  const top=el('div',null,'tile-top');if(lead)top.append(lead);const tt=el('div',null,'tile-title');tt.append(el('b',title));if(sub)tt.append(el('span',sub));top.append(tt);t.append(top);
  if(value!==undefined)t.append(el('div',value,'tile-value'+(off?' off':'')));
  if(body)t.append(el('p',body,'tile-body'));
  if(badges&&badges.length){const b=el('div',null,'badges');b.append(...badges);t.append(b)}
  if(kids)t.append(...kids);
  if(actions&&actions.length){const a=el('div',null,'tile-actions');a.append(...actions);t.append(a)}
  return t
}
function tiles(...kids){const g=el('div',null,'tiles');g.append(...kids);return g}
function emptyBox(title,text,...kids){const b=el('div',null,'empty');b.append(el('h2',title),el('p',text),...kids);return b}
let toastTimer;
function toast(msg){let t=q('toast');if(!t){t=el('div',null,'toast');t.id='toast';t.setAttribute('role','status');document.body.append(t)}t.textContent=msg;t.classList.remove('hidden');clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.classList.add('hidden'),4000)}
let openModal=null;
function modal(title,intro,opt={}){
  const back=el('div',null,'modal-back'),box=el('div',null,'modal'+(opt.wide?' wide':'')+(opt.danger?' danger':''));
  box.setAttribute('role','dialog');box.setAttribute('aria-modal','true');
  const hd=el('div',null,'modal-head'),h=el('h2',title);h.id='m'+(++uid);box.setAttribute('aria-labelledby',h.id);
  const x=button('×',()=>m.close(),'modal-x');x.setAttribute('aria-label','Close');hd.append(h,x);
  const bd=el('div',null,'modal-body');if(intro)bd.append(el('p',intro,'intro'));
  const ft=el('div',null,'modal-foot'),status=el('p',null,'modal-status');status.setAttribute('role','alert');ft.append(status,button('Close',()=>m.close()));
  box.append(hd,bd,ft);back.append(box);
  back.addEventListener('mousedown',e=>{if(e.target===back)m.close()});
  const before=document.activeElement;
  const m={box,body:bd,foot:ft,status,
    add(...k){bd.append(...k);return m},
    close(){back.remove();if(openModal===m){openModal=null;document.body.style.overflow=''}if(before&&before.isConnected&&before.focus)before.focus()},
    show(){if(openModal)openModal.close();openModal=m;document.body.style.overflow='hidden';document.body.append(back);const f=box.querySelector('.modal-body input:not([readonly]):not([type=checkbox]),.modal-body textarea:not([readonly]),.modal-body select')||box.querySelector('.modal-ok')||x;f.focus();return m}};
  return m
}
// Gives a window Cancel and one action. run() may return a message to show
// once the window closes; an error stays in the window.
function modalAction(m,label,run,cls){
  const go=button(label,async()=>{m.status.textContent='';go.disabled=true;try{const msg=await run();m.close();if(msg)toast(msg)}catch(e){m.status.textContent=e.message;go.disabled=false}},cls||'primary');
  go.classList.add('modal-ok');m.foot.replaceChildren(m.status,button('Cancel',()=>m.close()),go);return go
}
function formModal(title,intro,kids,label,run,opt={}){const m=modal(title,intro,opt);m.add(...kids);modalAction(m,label,run,opt.danger?'danger solid':'primary');return m.show()}

      t.dataset.search=(a.email+' '+(a.organization||'')).toLowerCase();return t}));

    let all=false;const onlyNew=input('checkbox');onlyNew.className='switch';const onlyLbl=el('label',null,'switch-row');onlyLbl.append(onlyNew,el('span','Not confirmed only'));

    const filter=()=>{const v=find.value.trim().toLowerCase();let shown=0,hidden=0;for(const t of cards.children){const match=(!v||t.dataset.search.includes(v))&&(!onlyNew.checked||t.dataset.unconfirmed);const show=match&&(all||v||onlyNew.checked||shown<30);if(show)shown++;else if(match)hidden++;t.classList.toggle('hidden',!show)}more.classList.toggle('hidden',!hidden)};

// Import a project exported from another PIBASE server.
function importWindow(){
  const file=input('file',''),pass=input('password','');file.accept='.pibx';pass.autocomplete='off';
  const m=modal('Import a project','Bring a project from another PIBASE server, using the file from its Settings, Move to another server. Its tables, users, files and keys come along, so apps only need the new address.');
  m.add(field('Export file',file),field('Passphrase',pass));
  const go=modalAction(m,'Import',async()=>{
    if(!file.files.length)throw Error('Choose the export file.');
    if(!pass.value)throw Error('Enter the passphrase the file was exported with.');
    const form=new FormData();form.append('passphrase',pass.value);form.append('file',file.files[0]);
    const h=apiHeaders();delete h['Content-Type'];
    go.textContent='Importing '+bytes(file.files[0].size)+'…';
    try{const r=await fetch('/_pibase/projects/import',{method:'POST',headers:h,body:form});const t=await r.text();
      if(!r.ok)throw Error(t.trim()||r.status);
      const res=JSON.parse(t);projects=(await api('/_pibase/projects'))||[];
      const x=projects.find(p=>p.id===res.project_id);
      if(x){refreshNav();openProject(x)}else load();
      return 'Imported '+res.name+'.'+(res.notes&&res.notes.length?' '+res.notes.join(' '):'')}
    finally{go.textContent='Import'}});
  m.show()
}

/* ---------- overview: usage and graphs ---------- */
const SERVICE_LABEL={database:'Database',auth:'Sign-in',storage:'Storage',realtime:'Realtime'};
const SERVICE_NOTE={database:'Reads and writes to your tables and calls to your functions.',auth:'Sign-up, log-in and password requests from your app users.',storage:'File and bucket requests.',realtime:'Live connections for changes and messages.'};
function shortTime(t,step){const d=new Date(t),hm=d.toLocaleTimeString(undefined,{hour:'numeric',minute:'2-digit'});return step>=86400?d.toLocaleDateString(undefined,{month:'short',day:'numeric'}):step>=3600?d.toLocaleDateString(undefined,{month:'short',day:'numeric'})+', '+hm:hm}
function bars(series,step,plain){const w=300,h=110,n=series.length||1,bw=w/n,max=Math.max(1,...series.map(x=>x.requests));const svg=svgEl('svg',{viewBox:'0 0 '+w+' '+h,role:'img'});svg.append(svgEl('path',{d:'M0 '+(h-0.5)+'H'+w,stroke:'#dce3ef',fill:'none'}));series.forEach((x,i)=>{if(!x.requests)return;const left=i*bw+bw*0.15,width=Math.max(1,bw*0.7);let y=h;for(const [v,color] of [[x.requests-x.warnings-x.errors,'#2fb47c'],[x.warnings,'#d99a1e'],[x.errors,'#d64545']]){if(v<=0)continue;const bh=Math.max(1.5,v/max*(h-8));y-=bh;const r=svgEl('rect',{x:left,y:y,width:width,height:bh,fill:color});const tip=svgEl('title',{});tip.textContent=shortTime(x.t,step)+': '+(plain?plural(x.requests,'request'):x.requests+' requests, '+x.warnings+' warnings, '+x.errors+' errors');r.append(tip);svg.append(r)}});return svg}
function chartCard(title,s,from,to,step,about,plain){
  const c=el('div',null,'card');const head=el('div',null,'card-head');const name=el('div',null,'card-name');name.append(el('span',title),el('b',String(s.requests)));head.append(name);
  if(!plain){const warn=el('div',null,'card-count warn');warn.append(el('span','Warnings'),el('b',String(s.warnings)));const err=el('div',null,'card-count err');err.append(el('span','Errors'),el('b',String(s.errors)));head.append(warn,err)}
  const axis=el('div',null,'axis');axis.append(el('span',shortTime(from,step)),el('span',shortTime(to,step)));
  c.append(head);if(about)c.append(el('p',about,'muted'));c.append(bars(s.series,step,plain),axis);return c
}
function dailyPoints(rows){const by={};for(const r of rows||[])by[String(r.day).slice(0,10)]=Number(r.requests)||0;const out=[],now=new Date();for(let i=29;i>=0;i--){const d=new Date(Date.UTC(now.getUTCFullYear(),now.getUTCMonth(),now.getUTCDate()-i));out.push({t:d.toISOString(),requests:by[d.toISOString().slice(0,10)]||0,warnings:0,errors:0})}return out}
function statTile(label,value,sub,meter){const s=el('div',null,'stat');s.append(el('span',label),el('b',value));if(sub)s.append(el('span',sub));if(meter!==undefined){const m=el('div',null,'meter'+(meter>=1?' full':meter>=0.8?' warn':''));const fill=el('i');fill.style.width=Math.min(100,meter*100).toFixed(1)+'%';m.append(fill);s.append(m)}return s}
async function openOverview(win){
  win=typeof win==='string'?win:'60m';
  const x=selected;if(!x)return;clearFrom(1);
  const p=pane(x.name,'How this project is being used: how much it stores, how many requests it gets, how many succeed, and which part of the API handles them. Figures refresh every 30 seconds.');
  p.classList.add('wide');p.append(el('p','Loading…'));add(p);
  const h=head(p);
  const render=async()=>{
    if(!p.isConnected||!selected||selected.id!==x.id)return;
    let a,days,fresh;
    try{[a,days,fresh]=await Promise.all([api('/_pibase/projects/'+encodeURIComponent(x.id)+'/activity?window='+win),api('/_pibase/projects/'+encodeURIComponent(x.id)+'/usage'),refreshProject(x)])}
    catch(e){p.replaceChildren(...h,el('p',e.message));return}
    if(!p.isConnected)return;
    const stats=el('div',null,'stat-grid');
    const limit=Number(fresh.max_database_bytes)||0;
    stats.append(statTile('Database size',bytes(fresh.database_bytes),limit?'of '+bytes(limit)+' allowed':'No size limit',limit?(Number(fresh.database_bytes)||0)/limit:undefined));
    stats.append(statTile('File storage',fresh.storage_error?'Unavailable':bytes(fresh.storage_bytes),fresh.storage_error?'Cannot read the files folder':'Files in storage'));

      tile({lead:iconBadge('shield'),title:'Confirm email',body:'On: a new user must click the link in a confirmation email before they can sign in. Off: signing up signs them in straight away.',kids:[row]}),
      tile({lead:iconBadge('grid'),title:'Site URL',value:a.site_url||'Not set',off:!a.site_url,body:'Your app\'s main address. Email links send people back here, signed in.',actions:[sbtn(a.site_url?'Change':'Set site URL',editLinks)]}),
      tile({lead:iconBadge('layers'),title:'Allowed redirect URLs',value:urls.length?urls.length+' '+(urls.length===1?'address':'addresses'):'None',off:!urls.length,body:'Other pages your app may ask email links to return to.',badges:urls.slice(0,4).map(u=>badge(u)),actions:[sbtn('Edit',editLinks)]})));
    p.replaceChildren(...kids)
  };
  render()
}

/* ---------- settings and account ---------- */
function openSettings(){
  clearFrom(2);const x=selected;const p=pane('Settings','Rename this project, set its API address and where server-side calls go, check its size limit, or delete it.');
  const rename=()=>{const name=input('text','',x.name);formModal('Rename project','Only changes the name shown in this dashboard. The project ID, address and keys stay the same.',[field('Name',name)],'Save name',async()=>{await api(projectPath(),body({name:name.value},'PATCH'));await refreshProject(x);openSettings();return 'Renamed to '+name.value})};
  const limit=()=>{const lim=input('number','Bytes',x.max_database_bytes||'');lim.min='1';formModal('Database size limit','The most data this project\'s database may hold. Writes are refused above it.',[field('Limit in bytes',lim,'For example 1073741824 is 1 GB.')],'Save limit',async()=>{await api(projectPath()+'/limits',body({max_database_bytes:Number(lim.value)},'PATCH'));const f=await refreshProject(x);openSettings();return 'Limit saved: '+bytes(f.max_database_bytes)})};
  const address=()=>{const pu=input('text','https://pibase.client.com',x.public_url||'');formModal('API address','The address your app uses for this project, such as https://pibase.client.com. It changes what the API keys page shows; the address must also point to this server.',[field('Address',pu,'Leave empty to use the server\'s default address.')],'Save API address',async()=>{const r=await api(projectPath()+'/public-url',body({url:pu.value},'PATCH'));await refreshProject(x);openSettings();return r&&r.url?'Saved. Apps use '+r.url+'.':(r&&r.api_url?'Using the server\'s default address: '+r.api_url+'.':'Using the address of this page.')})};
  const functions=()=>{const fn=input('text','https://your-site.example/api',x.functions_url||'');formModal('Server-side code','Where this project forwards /functions/v1/<name> calls: your site\'s own server routes, for example a Next.js app. Leave empty to turn it off.',[field('Address',fn,account?'A public address. The operator can allow one on your own network.':'Public, or a private address such as the site\'s server on this machine.')],'Save address',async()=>{const r=await api(projectPath()+'/functions',body({url:fn.value},'PATCH'));await refreshProject(x);openSettings();return r&&r.url?'Saved. Calls to /functions/v1/<name> go to '+r.url+'/<name>.':'Server-side code is turned off.'})};
  const exportWin=()=>{const ep=input('password',''),ep2=input('password','');ep.autocomplete='new-password';ep2.autocomplete='new-password';
    const m=modal('Move to another server','Downloads one file with this project\'s tables, users, files, settings and keys. Import it on another PIBASE server and your app keeps working: only its address changes. The file is locked with the passphrase you choose here.');
    m.add(field('Passphrase',ep,'At least 12 characters. You need it to import the file, so keep it safe.'),field('Enter it again',ep2));
    const go=modalAction(m,'Download export file',async()=>{
      if(ep.value.length<12)throw Error('The passphrase must be at least 12 characters.');
      if(ep.value!==ep2.value)throw Error('The two passphrases do not match.');
      go.textContent='Preparing the file…';
      try{const r=await fetch(projectPath()+'/export',{method:'POST',headers:apiHeaders(),body:JSON.stringify({passphrase:ep.value})});
        if(!r.ok)throw Error((await r.text()).trim()||r.status);
        const blob=await r.blob(),a=document.createElement('a'),name=(r.headers.get('Content-Disposition')||'').match(/filename="([^"]+)"/);
        a.href=URL.createObjectURL(blob);a.download=name?name[1]:'pibase-export.pibx';document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),60000);
        return 'Downloaded ('+bytes(blob.size)+'). Keep the file and passphrase safe: together they open the whole project.'}
      finally{go.textContent='Download export file'}});
    m.show()};
  const del=()=>dangerModal('Delete '+x.name+'?','Permanently deletes the database, its users, files, backups and keys. This cannot be undone.',x.id,'Delete project',async()=>{await api(projectPath(),body({confirm:x.id},'DELETE'));selected=null;refreshNav();await load();return 'Deleted '+x.name});
  p.append(tiles(
    tile({lead:avatar(x.name),title:'Project name',value:x.name,body:'Only changes the name shown in this dashboard.',actions:[sbtn('Rename',rename)]}),
    tile({lead:iconBadge('archive'),title:'Database size limit',value:x.max_database_bytes?bytes(x.max_database_bytes):'No limit set',body:account?'Only the server operator can change this limit.':'Writes are refused above it.',actions:account?[]:[sbtn('Change',limit)]}),
    tile({lead:iconBadge('key'),title:'API address',value:x.public_url||'Server default',off:!x.public_url,body:'The address your app uses for this project.',actions:[sbtn('Change',address)]}),
    tile({lead:iconBadge('code'),title:'Server-side code',value:x.functions_url||'Off',off:!x.functions_url,body:'Where /functions/v1/<name> calls are forwarded, such as your site\'s API routes.',actions:[sbtn(x.functions_url?'Change':'Set up',functions)]}),
    tile({lead:iconBadge('layers'),title:'Move to another server',body:'Download this whole project as one locked file, then import it on another PIBASE server.',actions:[sbtn('Export…',exportWin)]}),
    tile({lead:iconBadge('logout'),title:'Delete this project',cls:'danger',body:'Permanently deletes the database, its users, files, backups and keys.',actions:[sbtn('Delete project…',del,'danger')]})));
  add(p)
}
function openAccount(){
  clearFrom(0);const p=pane('Account','Your dashboard sign-in and organization. This is separate from the users of your projects.');
  const org=()=>{const o=input('text','',account.organization||'');formModal('Organization name','The name shown at the top of every page.',[field('Organization name',o)],'Save',async()=>{account=await api('/_pibase/auth/organization',body({organization:o.value},'PATCH'));renderWho();openAccount();return 'Saved'})};
  const pw=()=>{const cur=input('password',''),nw=input('password',''),nw2=input('password','');cur.autocomplete='current-password';nw.autocomplete=nw2.autocomplete='new-password';
    formModal('Change password','Choose a new password. You will be signed out everywhere else.',[field('Current password',cur),field('New password',nw,'At least 8 characters.'),field('New password again',nw2)],'Change password',async()=>{if(nw.value!==nw2.value)throw Error('The two new passwords do not match.');await api('/_pibase/auth/password',body({current_password:cur.value,new_password:nw.value}));return 'Password updated'})};
  const del=()=>dangerModal('Delete your account?','Permanently deletes your account and every project in it, with all their data. This cannot be undone.',account.email,'Delete account',async()=>{await api('/_pibase/auth/account',body({confirm:account.email},'DELETE'));location.replace('/')});
  p.append(tiles(
    tile({lead:avatar(account.organization||account.email),title:'Organization',value:account.organization||'Not set',off:!account.organization,body:'Shown at the top of every page.',actions:[sbtn('Change',org)]}),
    tile({lead:iconBadge('key'),title:'Password',value:account.email,body:'Signs you out everywhere else when changed.',actions:[sbtn('Change password',pw)]}),
    tile({lead:iconBadge('logout'),title:'Delete account',cls:'danger',body:'Deletes your account and every project in it.',actions:[sbtn('Delete account…',del,'danger')]})));
  add(p)
}

/* ---------- behaviour ---------- */
document.addEventListener('keydown',e=>{
  if(openModal){
    if(e.key==='Escape'){e.preventDefault();openModal.close();return}
    if(e.key==='Tab'){const f=[...openModal.box.querySelectorAll('button:not(:disabled),input:not(:disabled),textarea,select')].filter(n=>n.offsetParent!==null);if(f.length){const first=f[0],last=f[f.length-1];if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}}return}
  }
  if(e.key!=='Enter'||e.target.tagName!=='INPUT'||e.target.readOnly||e.target.type==='checkbox'||e.target.type==='file')return;
  const g=e.target.closest('.modal,.group,.empty');const act=g&&g.querySelector(g.classList.contains('modal')?'.modal-ok':'button.primary');if(act&&!act.disabled){e.preventDefault();act.click()}});
const backBtn=q('back');backBtn.onclick=()=>{if(chain.lastChild&&chain.lastChild.classList.contains('sub')){chain.lastChild.remove();alignChain()}};
new MutationObserver(()=>backBtn.classList.toggle('hidden',!(chain.lastChild&&chain.lastChild.classList.contains('sub')))).observe(chain,{childList:true});
// Installable as an app on phones and desktops; the worker keeps nothing on the device.
if('serviceWorker' in navigator)navigator.serviceWorker.register('/sw.js').catch(()=>{});
init();
</script>
